<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-width product UI modelled on portal search patterns: price-first listing cards, a Scout entry card, a saved list that answers "what next?". */
:root{
  --bg:#F1F1F5; --surface:#FFFFFF; --ink:#1D1B3F; --muted:#6B6A85; --line:#E3E2EC;
  --primary:#2A2768; --primary-ink:#FFFFFF; --primary-soft:#ECEBF6; --red:#E2343E; --red-soft:#FDE9EA; --photo1:#CFCFE2; --photo2:#ECE9F2;
  --fit:#17734A; --fit-bg:#E3F4EB; --pot:#975A00; --pot-bg:#FCF0DC; --con:#B42318; --con-bg:#FDE8E6; --unk:#3D5A80; --unk-bg:#E6EDF6;
  --sim:#6C3FB5; --sim-bg:#F1EAFB;
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111120; --surface:#1B1B2D; --ink:#EDEDF6; --muted:#A4A3BE; --line:#2D2C45;
  --primary:#B3AEFF; --primary-ink:#15133A; --primary-soft:#27254B; --red:#FF7A80; --red-soft:#3A1B1F; --photo1:#2B2A48; --photo2:#3A3758;
  --fit:#6FD3A0; --fit-bg:#15301F; --pot:#F2B65C; --pot-bg:#34270F; --con:#FF8F84; --con-bg:#3A1B19; --unk:#9FBDE3; --unk-bg:#1B2638;
  --sim:#CDB0F7; --sim-bg:#2B2043; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111120; --surface:#1B1B2D; --ink:#EDEDF6; --muted:#A4A3BE; --line:#2D2C45;
  --primary:#B3AEFF; --primary-ink:#15133A; --primary-soft:#27254B; --red:#FF7A80; --red-soft:#3A1B1F; --photo1:#2B2A48; --photo2:#3A3758;
  --fit:#6FD3A0; --fit-bg:#15301F; --pot:#F2B65C; --pot-bg:#34270F; --con:#FF8F84; --con-bg:#3A1B19; --unk:#9FBDE3; --unk-bg:#1B2638;
  --sim:#CDB0F7; --sim-bg:#2B2043; color-scheme:dark}
*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:440px;margin:0 auto;padding-block:0 104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:400}
h1{font-size:28px;line-height:1.1} h2{font-size:22px;line-height:1.15} h3{font-size:19px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.03em}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px}

.btn:focus-visible,.tab:focus-visible,a:focus-visible,textarea:focus-visible,.opt:focus-visible,.heart:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0;overflow:hidden}

.chip.pot{background:var(--pot-bg);color:var(--pot)} .chip.sim{background:var(--sim-bg);color:var(--sim)} .chip.pri{background:var(--primary-soft);color:var(--primary)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--primary);color:var(--primary-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:var(--primary-ink);opacity:.75;display:flex;align-items:center;gap:6px}
.hero .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.hero h2{color:var(--primary-ink)}
.hero .summary>div{background:rgba(255,255,255,.08)}
.hero .summary .with{background:rgba(255,255,255,.16)}
.hero .summary .n,.hero .summary .with .n{color:var(--primary-ink)}
.hero .xs,.hero .muted{color:var(--primary-ink);opacity:.8}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.scout{background:var(--primary);color:var(--primary-ink);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;border:0;text-align:left;width:100%}
.scout .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.scout b{display:block;font-size:15px} .scout span.s{font-size:12px;opacity:.85}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;border-radius:999px;padding:4px 11px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.ready{background:var(--fit-bg);color:var(--fit)} .status.ask{background:var(--pot-bg);color:var(--pot)} .status.aside{background:var(--con-bg);color:var(--con)} .status.proceed{background:var(--con-bg);color:var(--con)}
.why{font-size:13px;color:var(--muted)}
.qlist{margin:0;padding:10px 12px 10px 30px;background:var(--bg);border-radius:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding-block:9px;border-top:1px solid var(--line)}
.out{font-size:10px;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.out.Fits{background:var(--fit-bg);color:var(--fit)} .out.Potential{background:var(--pot-bg);color:var(--pot)} .out.Conflict{background:var(--con-bg);color:var(--con)} .out.Unknown{background:var(--unk-bg);color:var(--unk)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.src.sim{color:var(--sim)}
details>summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:13px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾"} details[open]>summary::after{content:" ▴"}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6}
.tabs .inner{max-width:440px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;padding:8px 4px 10px;color:var(--muted);font-weight:600;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab[aria-current="page"]{color:var(--primary)}
.tab .count{font-size:10px;background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:0 6px;margin-left:2px}
.sheetwrap{position:fixed;inset:0;background:rgba(14,13,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.whyask{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.45 var(--f-body);background:var(--bg);color:var(--ink)}
.msg{border-radius:12px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.msg.agent{background:var(--sim-bg)}
.log{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:8px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary>div{border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.summary .n{font-family:var(--f-display);font-size:34px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.summary .with{background:var(--primary-soft)} .summary .with .n{color:var(--primary)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch}
.flow .arr{align-self:center;opacity:.6;font-size:14px}
.brief{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.brief li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.bdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.bdot.ready{background:#4ade80}.bdot.ask{background:#fbbf24}.bdot.aside,.bdot.proceed{background:#f87171}
.btn.invert{background:var(--surface);color:var(--primary);border-color:transparent}
.extract{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.extract ul{margin:0;padding-left:18px}
.openline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.openline .go{font-weight:600;color:var(--primary);font-size:13px}
.peek summary{cursor:pointer;font-size:13px;font-weight:600;opacity:.9}
.peek .msg{margin-top:8px;color:var(--ink);background:var(--surface)}
.photo svg.ill{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.photo .tw{position:relative;z-index:1}.photo .badges,.photo .note,.photo .heart{z-index:1}
.cluster{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cluster .ln{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.persona{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.persona .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl td,table.tbl th{border-top:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
a{color:var(--primary)}
.hl{box-shadow:0 0 0 2px var(--primary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

  <button class="tab" data-tab="saved"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Worth pursuing?</button>
  <button class="tab" data-tab="answers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Answers</button>

<script>
const DATA = __DATA__;
const L = DATA.listings;
const byNo = n => L.find(l => l.audit_no === n);
const AED = n => 'AED ' + n.toLocaleString('en-US');
const fmtDate = d => { if(!d) return null; const [y,m,dd]=d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); };
const now = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PERSONA = {
  renter: { name:'Sara', offering:'rent', budget:80000, furnishedOnly:true, script:[15,5,12,7],
    intro:'Sara is looking for a furnished 1-bedroom to rent in Bloom Towers, JVC, up to AED 80,000 a year.' },
  buyer: { name:'Omar', offering:'sale', budget:1000000, furnishedOnly:false, script:[21,25,19,29,24,18],
    intro:'Omar wants to buy a 1-bedroom in Bloom Towers, JVC, to live in, up to AED 1,000,000.' }
};
// Scripted example answers for the progressive questions (shown preselected; user can change)
const SCRIPTED = {
  budgetFirm:'firm', moveIn:{renter:'2026-12-01', buyer:'2027-02-01'}, moveFirm:'firm', chequesMin:4, chequesFirm:'flexible', holidayOk:'yes', purpose:'live'
};

let S; // state
function reset(kind){
  S = { kind, view:'search', saved:[], c:{}, asked:{}, queue:[], kept:{}, answers:{}, sent:{}, log:[], detail:null, ask:null };
  S.c.budget = { value: PERSONA[kind].budget, firm: null };
}

/* ---------- properties & clusters ---------- */
function propOf(l){ return l.duplicate_cluster ? 'C'+l.duplicate_cluster : 'L'+l.audit_no; }
function membersOf(pid){ return pid[0]==='C' ? L.filter(l=>l.duplicate_cluster===pid.slice(1)) : [byNo(+pid.slice(1))]; }
function savedProps(){ const out=[]; S.saved.forEach(n=>{const p=propOf(byNo(n)); if(!out.includes(p)) out.push(p);}); return out; }
function propTitle(pid){ const m=membersOf(pid); const l=m[0];
  return (pid[0]==='C' ? 'One flat, '+m.length+' agencies · ' : '#'+l.audit_no+' · ') + l.tower + ' · ' + l.size_sqft + ' sqft'; }

/* ---------- constraint questions (progressive) ---------- */
function questionsFor(l){
  const q=[]; const c=S.c;
  if(c.budget.firm===null && !S.queue.includes('budgetFirm')) q.push('budgetFirm');
  if(S.kind==='renter'){
    if(!c.moveIn) q.push('moveIn');
    if((l.cheques===null || l.cheques<=2) && !c.cheques) q.push('cheques');
    if(l.price_basis==='holiday_home' && !c.holidayOk) q.push('holiday');
  } else {
    if(!c.purpose) q.push('purpose');
    const needsMove = l => l.tenancy_from_agent_text!=='vacant';
    if(!c.moveIn && (c.purpose==='live' || !c.purpose) && needsMove(l)) q.push('moveInBuyer');
  }
  return q.filter(x=>!S.queue.includes(x));
}
function openQuestion(){
  const k=S.queue[0]; const box=document.getElementById('sheet');
  if(!k){ box.innerHTML=''; render(); return; }
  if(k==='moveInBuyer' && S.c.purpose==='invest'){ S.queue.shift(); return openQuestion(); }
  const P=PERSONA[S.kind];
  const Q={
    budgetFirm:{t:`Is ${AED(P.budget)} a firm limit?`, why:'You set this in your search. I use it to decide whether an over-budget property is set aside or kept as a question.',
      opts:[['firm','Firm'],['flexible','I could stretch']], def:SCRIPTED.budgetFirm,
      save:v=>{S.c.budget.firm=v; logC('Budget '+AED(P.budget)+', '+v);} },
    moveIn:{t:'When do you need to move in by?', why:'Listings state an "available from" date. I compare it with yours. Current availability is a separate question for the agent.',
      opts:[['2026-12-01','1 Dec 2026'],['2027-01-01','1 Jan 2027'],['2027-03-01','1 Mar 2027']], def:SCRIPTED.moveIn.renter, firm:true,
      save:(v,f)=>{S.c.moveIn={date:v,firm:f}; logC('Move in by '+fmtDate(v)+', '+f);} },
    cheques:{t:'How many cheques do you need, at minimum?', why:'You saved a listing that shows 1–2 cheques or doesn\'t say. Fewer cheques means paying more upfront.',
      opts:[['1','1'],['2','2'],['4','4'],['6','6'],['12','12']], def:String(SCRIPTED.chequesMin), firm:true, firmDef:SCRIPTED.chequesFirm,
      save:(v,f)=>{S.c.cheques={min:+v,firm:f}; logC('At least '+v+' cheques, '+f);} },
    holiday:{t:'This one is a holiday-home let. Still interested?', why:'Its yearly price includes bills, but the booking fee, VAT, tourism tax and deposit are extra and the amounts aren\'t stated. So it isn\'t comparable with a standard lease.',
      opts:[['yes','Yes, if the total fits my budget'],['no','No, standard leases only']], def:SCRIPTED.holidayOk,
      save:v=>{S.c.holidayOk=v; logC('Holiday-home lets: '+(v==='yes'?'OK if the total fits':'not wanted'));} },
    purpose:{t:'Will you live in it or invest?', why:'A tenanted flat can suit an investor and not someone moving in.',
      opts:[['live','Live in it'],['invest','Invest']], def:SCRIPTED.purpose,
      save:v=>{S.c.purpose=v; logC(v==='live'?'Buying to live in':'Buying to invest');} },
    moveInBuyer:{t:'When do you need to move in by?', why:'This listing is tenanted or doesn\'t say whether it\'s vacant. I need your date to judge it.',
      opts:[['2027-02-01','1 Feb 2027'],['2027-06-01','1 Jun 2027'],['2027-12-01','1 Dec 2027']], def:SCRIPTED.moveIn.buyer, firm:true, firmDef:'firm',
      save:(v,f)=>{S.c.moveIn={date:v,firm:f}; logC('Move in by '+fmtDate(v)+', '+f);} }
  }[k];
  let val=Q.def, firm=Q.firmDef||SCRIPTED.moveFirm;
  box.innerHTML=`<div class="sheetwrap" role="dialog" aria-modal="true" aria-labelledby="qT"><div class="sheet"><span class="grab"></span>
    <p class="mono muted">SCOUT · ONE QUESTION</p>
    <h2 id="qT">${esc(Q.t)}</h2>
    <p class="whyask"><b>Why I'm asking:</b> ${esc(Q.why)}</p>
    <div class="opts" id="qO">${Q.opts.map(([v,lab])=>`<button class="opt" data-v="${v}" aria-pressed="${v===val}">${esc(lab)}</button>`).join('')}</div>
    ${Q.firm?`<div><p class="small muted">Is that firm?</p><div class="opts" id="qF">${['firm','flexible'].map(v=>`<button class="opt" data-f="${v}" aria-pressed="${v===firm}">${v==='firm'?'Firm':'Flexible'}</button>`).join('')}</div></div>`:''}
    <p class="small muted">The highlighted answer is the scripted example for ${esc(P.name)}. Change it to see different outcomes.</p>
    <button class="btn primary block" id="qGo">Save answer</button></div></div>`;
  box.querySelectorAll('#qO .opt').forEach(b=>b.onclick=()=>{val=b.dataset.v; box.querySelectorAll('#qO .opt').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  box.querySelectorAll('#qF .opt').forEach(b=>b.onclick=()=>{firm=b.dataset.f; box.querySelectorAll('#qF .opt').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  box.querySelector('#qGo').onclick=()=>{Q.save(val,firm); S.queue.shift(); openQuestion();};
  box.querySelector('#qGo').focus();
}

/* ---------- assessment (R1–R4) ---------- */
function assess(pid){
  const m=membersOf(pid), c=S.c, rows=[], qs=[], A=S.answers[pid]||{};
  const l=m[0];
  const allPrices=[...new Set(m.map(x=>x.price_aed))];
  // Prices within 0.5% of each other are treated as the same asking price (e.g. 949,999 vs 950,000)
  const prices = (Math.max(...allPrices)-Math.min(...allPrices))/Math.min(...allPrices) < 0.005 ? [Math.max(...allPrices)] : allPrices;
  // Budget
  if(S.kind==='renter' && l.price_basis==='holiday_home'){
    if(A.total==='over') rows.push(row('Budget', c.budget.firm==='firm'?'Conflict':'Potential', `The agent says the extras take the yearly total above ${AED(c.budget.value)}.`, A.src));
    else if(l.price_aed>c.budget.value) rows.push(row('Budget', c.budget.firm==='firm'?'Conflict':'Potential', `Advertised ${AED(l.price_aed)} is above your ${AED(c.budget.value)}, before extras.`, 'Listing · price'));
    else { rows.push(row('Budget','Potential',`Advertised ${AED(l.price_aed)} includes bills. The booking fee, VAT, tourism tax and deposit are extra and their amounts aren't stated, so the total may exceed your ${AED(c.budget.value)}.`,'Listing · price + Agent\'s description')); qs.push('What is the full yearly cost, including the booking fee, VAT, tourism tax and deposit?'); }
  } else {
    const over=prices.filter(p=>p>c.budget.value);
    if(over.length===prices.length) { rows.push(row('Budget', c.budget.firm==='firm'?'Conflict':'Potential', `Advertised ${prices.map(AED).join(' / ')} is above your ${AED(c.budget.value)}.`,'Listing · price')); if(c.budget.firm!=='firm') qs.push('Is the price negotiable?'); }
    else if(over.length) { rows.push(row('Budget','Potential',`Advertised ${prices.map(AED).join(' / ')}. ${over.map(AED).join(' / ')} is above your ${AED(c.budget.value)}; the other price is within it. Which price is current isn't confirmed.`,'Listing · price')); qs.push('Which asking price is current?'); }
    else rows.push(row('Budget','Fits',`Advertised ${allPrices.map(AED).join(' / ')}${allPrices.length>prices.length?' (effectively the same price)':''}, within your ${AED(c.budget.value)}.`,'Listing · price'));
  }
  // Near-identical prices across a cluster: keep both, don't treat as resolved
  if(allPrices.length>1 && prices.length===1){
    rows.push({...row('Which price is current','Unknown',`Advertised at ${m.map(x=>AED(x.price_aed)+' (#'+x.audit_no+')').join(', ')}. The difference is negligible for your budget, but which one is current isn't confirmed.`,'Our check · 3 Nov 2026'), nb:true});
  }
  // Price conflict across a cluster (R2/R3)
  if(prices.length>1){
    if(A.priceAnswers) rows.push({...row('Which price is current','Unknown',A.priceAnswers, A.src), nb:true});
    else { rows.push(row('Which price is current','Unknown',`This flat is advertised at ${m.map(x=>AED(x.price_aed)+' (#'+x.audit_no+')').join(', ')}. Neither is confirmed.`,'Our check · 3 Nov 2026')); qs.push('Which asking price is current?'); }
  }
  // Holiday-home basis (R4)
  if(l.price_basis==='holiday_home'){
    if(c.holidayOk==='no') rows.push(row('Type of let','Conflict','Holiday-home let. You asked for standard leases only.','Listing · permit type'));
    else rows.push(row('Price basis','Fits','Holiday-home let: bills included, extra fees not in the price. Not comparable with standard yearly leases.','Listing · permit type + Agent\'s description'));
  }
  if(S.kind==='renter'){
    // Move-in vs stated available-from
    if(c.moveIn){
      const af=l.available_from;
      if(!af) rows.push(row('Move-in date','Unknown','The listing doesn\'t state an "available from" date.','Unknown'));
      else if(af<=c.moveIn.date) rows.push(row('Move-in date','Fits',`The listing states available from ${fmtDate(af)}; you need ${fmtDate(c.moveIn.date)}.`,'Listing · available from'));
      else rows.push(row('Move-in date', c.moveIn.firm==='firm'?'Conflict':'Potential',`The listing states available from ${fmtDate(af)}, after your ${fmtDate(c.moveIn.date)}.`,'Listing · available from'));
    }
    // Cheques
    if(c.cheques){
      if(A.chequesN!=null){ const okC=A.chequesN>=c.cheques.min; rows.push(row('Cheques', okC?'Fits':(c.cheques.firm==='firm'?'Conflict':'Potential'), okC?A.cheques:`${A.cheques} You need at least ${c.cheques.min}.`, A.src)); }
      else if(l.cheques===null){ rows.push(row('Cheques','Unknown','The listing doesn\'t state how many cheques are accepted.','Unknown')); qs.push('How many cheques does the owner accept?'); }
      else if(l.cheques>=c.cheques.min) rows.push(row('Cheques','Fits',`Listing shows ${l.cheques} cheques; you need at least ${c.cheques.min}.`,'Listing · cheques'));
      else { rows.push(row('Cheques', c.cheques.firm==='firm'?'Conflict':'Potential',`Listing shows ${l.cheques} cheque${l.cheques>1?'s':''}; you need at least ${c.cheques.min}.`,'Listing · cheques')); if(c.cheques.firm!=='firm') qs.push(`The listing shows ${l.cheques} cheque${l.cheques>1?'s':''}. Would the owner accept ${c.cheques.min}?`); }
    }
  } else if(c.purpose){
    // Occupancy
    if(c.purpose==='invest') rows.push(row('Occupancy','Fits','You\'re investing, so a tenanted flat isn\'t a problem.','You said'));
    else {
      const ten=m.map(x=>x.tenancy_from_agent_text);
      if(A.tenancyEnd){ // month-only answer: A.tenancyEnd = first day of that month, A.tenancyEndNext = first day of the next month
        const mi=c.moveIn&&c.moveIn.date; let out, note;
        if(!mi){ out='Potential'; note=' Your move-in date isn\'t set.'; }
        else if(mi<A.tenancyEnd){ out=c.moveIn.firm==='firm'?'Conflict':'Potential'; note=` You need to move in by ${fmtDate(mi)}.`; }
        else if(mi<=A.tenancyEndNext){ out='Unknown'; note=` Only the month was given, and your move-in date of ${fmtDate(mi)} is close to it, so the exact end date matters.`; qs.push('What is the exact date the tenancy ends, and when could I take handover?'); }
        else { out='Potential'; note=` No stated overlap: even if it runs to the end of that month, it ends before your move-in date of ${fmtDate(mi)}. But the exact end date and the handover date aren't confirmed.`; qs.push('When exactly does the tenancy end, and when could I take handover?'); }
        rows.push(row('Occupancy', out, `${A.occupancy}${note} Agent-reported, not verified.`, A.src)); }
      else if(A.occupancy){ rows.push(row('Occupancy', A.occupancyOut, A.occupancy, A.src)); }
      else if(ten.every(t=>t==='vacant')) rows.push(row('Occupancy','Fits','The description says vacant. Stated by the agent, not confirmed.','Agent\'s description'));
      else if(ten.includes('tenanted')){ rows.push(row('Occupancy','Potential',`The description says tenanted. The tenancy end date isn't stated${c.moveIn?', so it may or may not end before your '+fmtDate(c.moveIn.date):''}.`,'Agent\'s description')); qs.push('When does the current tenancy end?'); }
      else {
        const said=m.filter(x=>x.tenancy_from_agent_text==='vacant').map(x=>'#'+x.audit_no), silent=m.filter(x=>x.tenancy_from_agent_text!=='vacant').map(x=>'#'+x.audit_no);
        rows.push(row('Occupancy','Unknown', said.length?`${said.join(', ')} describes it as vacant; ${silent.join(', ')} ${silent.length>1?"don't":"doesn't"} say. Not carried across listings.`:`The description doesn't say whether it's vacant.`, said.length?'Agent\'s description · mixed':'Unknown'));
        qs.push(c.moveIn?`Is it vacant, and could I move in by ${fmtDate(c.moveIn.date)}?`:'Is it vacant?');
      }
    }
  }
  // Availability is always separate
  rows.push(row('Available now', A.available?'Fits':'Unknown', A.available || 'Listings never confirm current availability. Only the agent can.', A.available?A.src:'Unknown'));
  // Next step
  let step;
  const conflicts=rows.filter(r=>r.out==='Conflict');
  if(conflicts.length && !S.kept[pid]) step={k:'aside', label:'Set aside', why:conflicts.map(r=>r.text).join(' ')};
  else if(conflicts.length) step={k:'proceed', label:'Proceed despite conflict', why:'Conflict: '+conflicts.map(r=>r.text).join(' ')+' The conflict still stands.'};
  else if(rows.some(r=>(r.out==='Potential'||r.out==='Unknown') && r.k!=='Available now' && !r.nb)) step={k:'ask', label:'Ask first', why:'One or two answers could change your decision.'};
  else step={k:'ready', label:'Ready for viewing enquiry', why:'Nothing in the listing conflicts with what you need. Current availability is still unknown until an agent answers.'};
  const uniq=[...new Set(qs)].slice(0,2);
  uniq.push(A.available? 'Could I view it this week?' : 'Is it still available, and could I view it this week?');
  return {rows, step, questions:uniq.slice(0,3), m};
}
function row(k,out,text,src){ return {k,out,text,src}; }

/* ---------- simulated agent replies ---------- */
function simulateReply(pid, viaScout){
  const no=membersOf(pid).map(x=>x.audit_no); const t=now(); const src=(viaScout?'Agent says':'You recorded the agent\'s reply')+' · '+t+' · Simulated';
  const A=S.answers[pid]=S.answers[pid]||{}; let msgs=[];
  const has=n=>no.includes(n);
  if(has(5)){ Object.assign(A,{available:'Still available (agent says).',cheques:'The owner accepts 4 cheques (agent says).',chequesN:4,viewing:'Thursday evening',src}); msgs=['Still available. The owner accepts 4 cheques. A viewing is possible Thursday evening.']; }
  else if(has(7)){ Object.assign(A,{total:'over',src}); msgs=['With the booking fee, VAT, tourism tax and deposit, the yearly total is above AED 80,000.']; }
  else if(has(12)){ A.noreply=true; msgs=[]; }
  else if(has(15)){ Object.assign(A,{available:'Still available (agent says).',viewing:'Saturday morning',src}); msgs=['Still available. A viewing is possible Saturday morning.']; }
  else if(has(18)){ Object.assign(A,{available:'Still available (agent says).',viewing:'Sunday afternoon',src}); msgs=['Still available, vacant. A viewing is possible Sunday afternoon.']; }
  else if(has(21)){ const tg=S.sent[pid].target||'21'; const others=no.filter(n=>String(n)!==String(tg)).map(n=>'#'+n).join(', ');
    Object.assign(A,{occupancy:`The agency of #${tg} says it's vacant and can hand over before 1 Feb 2027. ${others} don't state occupancy; this is one agency's statement, not a confirmed fact.`,occupancyOut:'Fits',available:`The agency of #${tg} says it's still available.`,src}); msgs=['Vacant. The seller can hand over before 1 Feb 2027. Still available.']; }
  else if(has(19)){ const tg=String(S.sent[pid].target||'all'); const asked=tg==='all'?[19,29]:[+tg]; const notAsked=[19,29].filter(n=>!asked.includes(n));
    const R={19:{price:'AED 960,000',quote:'Still AED 960,000. Vacant.'},29:{price:'AED 1,000,000',quote:'Asking AED 1,000,000. Vacant.'}};
    if(asked.length===2) Object.assign(A,{priceAnswers:"The agencies' answers still differ: AED 960,000 (agency of #19) and AED 1,000,000 (agency of #29). Scout doesn't choose between them. Settle it with the agency you view with.",occupancy:'Both agencies say vacant (agent says).',occupancyOut:'Fits',available:'Both agencies say still available (agent says).',src});
    else Object.assign(A,{priceAnswers:`The agency of #${asked[0]} says ${R[asked[0]].price}. #${notAsked[0]}'s agency wasn't asked, so its ${R[notAsked[0]].price} price isn't confirmed. Settle the price with the agency you view with.`,occupancy:`The agency of #${asked[0]} says vacant (agent says). #${notAsked[0]}'s agency wasn't asked.`,occupancyOut:'Fits',available:`The agency of #${asked[0]} says still available (agent says).`,src});
    msgs=asked.map(n=>`Agency of #${n}: "${R[n].quote}"`); }
  else if(has(24)){ Object.assign(A,{occupancy:'Tenanted until August 2027 (agent says).',tenancyEnd:'2027-08-01',tenancyEndNext:'2027-09-01',src}); msgs=['The current tenancy runs until August 2027.']; }
  else { A.noreply=true; }
  S.sent[pid].replies=msgs.map(x=>({t,text:x}));
  S.sent[pid].status=msgs.length?'replied':'noreply';
  const before=S.sent[pid].stepBefore, after=assess(pid).step.label;
  S.log.push({t, text:`${propTitle(pid)}: ${before} → ${after}${msgs.length?'':' (no reply yet; that doesn\'t mean it\'s unavailable)'}`, src: msgs.length?src:'Simulated'});
}

  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  app.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{S.detail=b.dataset.detail; S.detailFrom='saved'; go('detail');});
  app.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{ if(e.target.closest('a,button')) return; S.detail=el.dataset.open; S.detailFrom='search'; go('detail');});
  const aa=document.getElementById('askAll'); if(aa) aa.onclick=()=>{
    savedProps().map(pid=>({pid,...assess(pid)})).filter(r=>r.step.k!=='aside'&&!S.sent[r.pid]).forEach(r=>{
      S.ask=r.pid; S.askTarget=null; S.askVia='scout'; S.draftEdited=false; vAsk();
      S.sent[r.pid]={via:'scout',t:now(),text:S.draft,status:'waiting',target:S.curTarget,stepBefore:r.step.label};
      S.log.push({t:now(),text:`${propTitle(r.pid)}: questions sent via Scout (you approved)`,src:'Simulated'});
      simulateReply(r.pid,true); });
    render(); window.scrollTo({top:0}); };
  app.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{S.ask=b.dataset.ask; S.askTarget=null; S.askVia='self'; S.draft=null; S.draftEdited=false; go('ask');});
  app.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{S.kept[b.dataset.keep]=now(); S.log.push({t:now(),text:propTitle(b.dataset.keep)+': proceed despite the conflict (your decision; the conflict still stands)',src:'You said'}); render();});
  app.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{const k=b.dataset.flip,c=S.c;
    if(k==='cheques') c.cheques.firm=c.cheques.firm==='firm'?'flexible':'firm';
    if(k==='purpose') c.purpose=c.purpose==='live'?'invest':'live';
    if(k==='budget') c.budget.firm=c.budget.firm==='firm'?'flexible':'firm';
    logC(k==='purpose'?(c.purpose==='live'?'Buying to live in':'Buying to invest'):k==='cheques'?'Cheques now '+c.cheques.firm:'Budget now '+c.budget.firm);
    render();});
  app.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{S.askTarget=b.dataset.target; render();});
  app.querySelectorAll('[data-via]').forEach(b=>b.onclick=()=>{S.askVia=b.dataset.via; render();});
  const rd=document.getElementById('resetDraft'); if(rd) rd.onclick=()=>{S.draftEdited=false; render();};
  const ta=document.getElementById('draft'); if(ta) ta.oninput=()=>{S.draft=ta.value; S.draftEdited=true; const wa=document.getElementById('wa'); if(wa) wa.href='https://wa.me/?text='+encodeURIComponent(ta.value);};
  const cp=document.getElementById('copy'); if(cp) cp.onclick=()=>{navigator.clipboard?.writeText(S.draft).then(()=>{cp.textContent='Copied';},()=>{ta.select(); cp.textContent='Selected. Copy it now';}) ?? (ta.select());};
  const send=(via)=>{const pid=S.ask; S.sent[pid]={via,t:now(),text:S.draft,status:'waiting',target:S.curTarget,stepBefore:assess(pid).step.label};
    S.log.push({t:now(),text:`${propTitle(pid)}: questions sent ${via==='self'?'by you':'via Scout'}`,src:'Simulated'}); go('answers');};
  const ss=document.getElementById('sendSelf'); if(ss) ss.onclick=()=>send('self');
  const sc=document.getElementById('sendScout'); if(sc) sc.onclick=()=>send('scout');
  app.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{simulateReply(b.dataset.reply, S.sent[b.dataset.reply].via==='scout'); render();});
  app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{go('saved'); setTimeout(()=>{const el=document.getElementById('p-'+b.dataset.goto); if(el){el.scrollIntoView({block:'start'}); el.classList.add('hl');}},50);});
}
document.getElementById('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.tab));
render();
</script>
